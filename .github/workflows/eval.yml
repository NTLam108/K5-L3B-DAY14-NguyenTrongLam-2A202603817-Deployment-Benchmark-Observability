# ============================================================
# Quality gate — chạy eval trên golden dataset trước khi merge
#
# run_eval.py thoát với exit code 1 khi accuracy < MIN_ACCURACY hoặc có regression
# → step fail → job fail → PR không merge được (khi job này là required status check
#   trong Settings → Branches → Branch protection rules).
# ============================================================
name: quality-gate

on:
  pull_request:
    paths:
      - "06-lab-complete/benchmark-observability/develop/**"
      - ".github/workflows/eval.yml"
  push:
    branches: [main]
    paths:
      - "06-lab-complete/benchmark-observability/develop/**"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

jobs:
  eval:
    name: Eval golden dataset (accuracy ≥ 85%)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    env:
      AGENT_VERSION: v2
      PORT: "8000"
      MOCK_ERROR_RATE: "0"      # tắt lỗi upstream ngẫu nhiên → CI không fail oan
      MIN_ACCURACY: "0.85"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 06-lab-complete/benchmark-observability/develop/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start agent
        run: |
          nohup python app.py > agent.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "http://localhost:${PORT}/health" && exit 0
            sleep 1
          done
          echo "Agent không lên sau 30s"; cat agent.log; exit 1

      - name: Run eval (quality gate)
        run: |
          mkdir -p reports
          python eval/run_eval.py --url "http://localhost:${PORT}" \
            --min-accuracy "${MIN_ACCURACY}" --out reports/eval_ci.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            06-lab-complete/benchmark-observability/develop/reports/eval_ci.json
            06-lab-complete/benchmark-observability/develop/agent.log
          if-no-files-found: ignore
