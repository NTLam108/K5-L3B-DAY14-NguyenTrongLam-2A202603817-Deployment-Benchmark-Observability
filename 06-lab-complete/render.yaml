# Render Blueprint — agent (Docker) + Redis-compatible Key Value.
# Render đọc blueprint ở gốc repo: khi dùng Render, copy file này ra gốc repo
# (đường dẫn rootDir bên dưới đã tính từ gốc repo).
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh, không ghi giá trị vào repo
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    plan: free
    ipAllowList: []                  # chỉ cho service trong cùng tài khoản Render truy cập
