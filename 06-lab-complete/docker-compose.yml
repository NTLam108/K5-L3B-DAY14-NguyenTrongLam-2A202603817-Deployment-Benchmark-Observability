# ============================================================
# Agent + Redis
#   cp .env.example .env    # đặt AGENT_API_KEY
#   docker compose up --build
#   curl http://localhost:8000/health
# ============================================================
services:
  agent:
    build: .
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false          # không có .env vẫn chạy được
    environment:
      PORT: "8000"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
